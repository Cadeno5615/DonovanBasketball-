<style>
:root{
  --navy:#0a2a66; --blue:#1450b8; --blue-2:#2f6fe0; --sky:#e8f0fd; --line:#c9d8f3;
  --ink:#0d1b33; --muted:#5b6b86; --white:#fff; --bg:#f4f7fd; --ok:#127a3e; --warn:#b5590d; --bad:#b3261e;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Oswald,Impact,sans-serif;letter-spacing:.02em;margin:0}
button,input,select{font:inherit}
.hidden{display:none!important}

/* header */
header.top{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -10% -60px -10%;height:120px;background:var(--blue);transform:rotate(-2deg);opacity:.55}
.top-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 16px 26px;display:flex;align-items:center;gap:14px}
.ball{width:44px;height:44px;flex:none}
.top h1{font-size:clamp(22px,4.5vw,32px);line-height:1.05;text-transform:uppercase}
.top .sub{font-size:13px;opacity:.85;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.top-nav{margin-left:auto;display:flex;gap:6px}
.top-nav a{white-space:nowrap;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4)}
.top-nav a:hover{background:rgba(255,255,255,.12)}

main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.demo-banner{background:#fff6e5;color:#7a4300;border:1px solid #f3d29a;padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:18px}

/* cards & forms */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 0 rgba(10,42,102,.04)}
.center-card{max-width:460px;margin:24px auto 0;text-align:center}
.center-card h2{font-size:28px;color:var(--navy);text-transform:uppercase}
.center-card p{color:var(--muted);margin:8px 0 18px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--navy);text-align:left;margin:0 0 6px}
input[type=text],input[type=password],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(47,111,224,.18)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--navy)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;margin-top:14px;font-size:17px;padding:14px}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--sky)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0c9c6}
.btn.danger:hover{background:#fdf0ef}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.err{color:var(--bad)}
.check{width:76px;height:76px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin:4px auto 14px}
.link{color:var(--blue);font-weight:600}

/* owner */
.owner-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.owner-head h2{font-size:26px;color:var(--navy);text-transform:uppercase}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--navy);font-size:16px;margin-right:4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--navy);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.note{font-size:13px;color:var(--muted)}

table.players{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.players th,table.players td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf2fb;font-size:15px}
table.players th{background:var(--sky);color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
table.players tr:last-child td{border-bottom:0}
table.players td.num{color:var(--muted);width:40px}
table.players td.act{text-align:right;white-space:nowrap}
table.players input{padding:7px 9px;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sky);color:var(--blue)}
.tag.none{background:#f1f1f1;color:#888}
.empty{padding:30px;text-align:center;color:var(--muted)}

.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.team.off{border-color:#f0c48e}
.team-h{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px}
.team.off .team-h{background:var(--warn)}
.team-h .num{font-family:Oswald,Impact,sans-serif;font-size:13px;opacity:.75}
.team-h .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-h .cnt{font-size:12px;opacity:.85}
.team-h .rename{background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;flex:none;line-height:1}
.team-h .rename:hover{background:rgba(255,255,255,.3)}
.team-h.editing input{flex:1;min-width:0;padding:6px 8px;font-size:15px;font-weight:700;border-radius:7px;border:0}
.rename-bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.team ul{list-style:none;margin:0;padding:6px}
.team li{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:14px}
.team li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li select{width:auto;max-width:120px;padding:4px 6px;font-size:13px;border-radius:7px}
.team .foot{padding:4px 12px 10px;text-align:right}
.team.pool{border-style:dashed}
.team.pool .team-h{background:#6b7a93}

/* bracket (double-sided: left half flows right, right half flows left, final in the middle) */
body{overflow-x:clip}
.bracket-wrap{overflow-x:auto;padding:6px 16px 90px;-webkit-overflow-scrolling:touch;margin:0 calc(50% - 50vw)}
.zoom-bar{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin:0 0 6px}
.zoom-bar span{font-size:12px;color:var(--muted);margin-right:2px}
.zb{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--blue);font-weight:700;border-radius:8px;min-width:36px;height:32px;padding:0 10px;cursor:pointer;font-size:15px}
.zb:hover{background:var(--sky)}
.bracket{display:flex;gap:28px;min-width:max-content;align-items:stretch;margin:0 auto}
.round{display:flex;flex-direction:column;width:200px;flex:none}
.round-title{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;color:var(--navy);font-size:15px;text-align:center;padding:6px 0 10px;border-bottom:2px solid var(--blue);margin-bottom:8px}
.round.final .round-title{color:#fff;background:var(--navy);border-radius:8px 8px 0 0;border-bottom-color:var(--navy)}
.round-body{flex:1;display:flex;flex-direction:column;position:relative}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.pair>.slot{flex:1;display:flex;align-items:center;padding:6px 0}
/* connectors, left side */
.has-next .pair::after{content:"";position:absolute;right:-14px;top:25%;bottom:25%;width:14px;border:2px solid var(--line);border-left:0;border-radius:0 6px 6px 0}
.has-next .pair.top-only::after{bottom:50%;border-bottom:0;border-radius:0 6px 0 0}
.has-next .pair.bottom-only::after{top:50%;border-top:0;border-radius:0 0 6px 0}
.has-next .pair.single::after{top:50%;bottom:auto;height:0;border-top:2px solid var(--line);border-right:0;border-bottom:0;border-radius:0}
.has-next .pair.none::after{display:none}
.has-prev .match::before{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
/* connectors, right side (mirrored) */
.side-r.has-next .pair::after{right:auto;left:-14px;border:2px solid var(--line);border-right:0;border-radius:6px 0 0 6px}
.side-r.has-next .pair.top-only::after{bottom:50%;border-bottom:0;border-radius:6px 0 0 0}
.side-r.has-next .pair.bottom-only::after{top:50%;border-top:0;border-radius:0 0 0 6px}
.side-r.has-next .pair.single::after{border:0;border-top:2px solid var(--line);border-radius:0}
.side-r.has-prev .match::before{left:auto;right:-14px}
/* final in the middle: lines come in from both sides */
.round.final .match{border:2px solid var(--navy)}
.round.final.has-prev .match::after{content:"";position:absolute;right:-14px;top:50%;width:14px;border-top:2px solid var(--line)}
.match{position:relative;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px}
.match>.team-line:first-child{border-radius:9px 9px 0 0}
.match>.team-line:last-child{border-radius:0 0 9px 9px}
.match.ghost{visibility:hidden}
.team-line{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:14px;font-weight:600;min-height:38px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.team-line+.team-line{border-top:1px solid #edf2fb}
.team-line .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-line.bye{color:#a5afc2;font-style:italic;font-weight:500}
.team-line.tbd{color:#a5afc2;font-weight:500}
.team-line.win{background:var(--blue);color:#fff}
.team-line.lose{color:#8a96ad}
.score{font-family:Oswald,Impact,sans-serif;font-size:16px;min-width:22px;text-align:right;flex:none}
.score-in{width:46px!important;flex:none;padding:5px 6px!important;font-size:15px!important;text-align:center;font-weight:700;border-radius:7px!important;border:1.5px solid var(--line);color:var(--ink);background:#fff}
.team-line.win .score-in{border-color:#fff}
.score-in.bad{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(179,38,30,.18)}
.final-slot{position:relative}
.champ-box{position:absolute;left:0;right:0;top:calc(100% + 16px);background:var(--navy);color:#fff;border-radius:12px;padding:14px;text-align:center}
.champ-box .k{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:13px;opacity:.8}
.champ-box .v{font-family:Oswald,Impact,sans-serif;font-size:21px;margin-top:4px;line-height:1.15;word-break:break-word}
/* conferences */
.conf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:14px}
.conf{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.conf-h{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
.conf-h .nm{font-family:Oswald,Impact,sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conf-h .cnt{font-size:12px;opacity:.8}
.conf-h input{flex:1;min-width:0;padding:6px 8px;font-size:15px;font-weight:700;border-radius:7px;border:0}
.conf-h .rename{background:rgba(255,255,255,.15);border:0;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;flex:none}
.conf-h .rename:hover{background:rgba(255,255,255,.3)}
.conf .rename-bar{padding:8px 12px 0}
table.stand{width:100%;border-collapse:collapse}
table.stand th,table.stand td{padding:7px 8px;font-size:14px;text-align:center;border-bottom:1px solid #edf2fb}
table.stand th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);background:var(--sky)}
table.stand td.tm{text-align:left;font-weight:600;max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.stand td.pl{color:var(--muted);font-weight:700;width:26px}
table.stand td.sd{width:44px}
table.stand tr.first td{background:#f3f7ff}
.seedtag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--blue);color:#fff;white-space:nowrap}
.rec{width:44px!important;padding:4px 4px!important;font-size:14px!important;text-align:center;font-weight:700;border-radius:7px!important}
.mv{width:auto!important;padding:3px 4px!important;font-size:12px!important;border-radius:7px!important;max-width:92px}
.games{padding:6px 12px 12px}
.games h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.game{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed #e6edf9;font-size:14px}
.game:last-child{border-bottom:0}
.game .ta{text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .tb{text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .w{color:var(--blue)}
.game .l{color:#8a96ad}
.game .dash{color:var(--muted)}
.game .sc{font-family:Oswald,Impact,sans-serif;font-size:16px;min-width:22px;text-align:center}
.gscore{width:44px!important;padding:4px!important;font-size:14px!important;text-align:center;font-weight:700;border-radius:7px!important}
.rounds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.rounds-grid .conf-h .nm{font-size:16px}
.game small.cf{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
.num-in{width:70px!important;text-align:center;padding:9px 8px!important;font-weight:700}
.section-title{color:var(--navy);text-transform:uppercase;font-size:24px;margin:26px 0 8px}
.team-line .seed{font-size:11px;font-weight:700;color:var(--muted);min-width:14px;flex:none}
.team-line.win .seed{color:rgba(255,255,255,.8)}
.waiting{max-width:520px;margin:30px auto;text-align:center}
.waiting h2{color:var(--navy);text-transform:uppercase;font-size:26px}
.waiting p{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:-4px 0 12px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  table.stand th,table.stand td{padding:6px 4px}
  table.stand .pdc{display:none}
  .rec{width:34px!important}
  .mv{max-width:58px}
  table.stand td.sd{width:34px}
  .top-nav a{padding:6px 10px;font-size:13px}
  .row{flex-direction:column}
  table.players .hide-sm{display:none}
  .card{padding:18px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <svg class="ball" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fff"/><g fill="none" stroke="#1450b8" stroke-width="2.4"><circle cx="24" cy="24" r="21"/><path d="M3 24h42M24 3v42M9 9c7 6 7 24 0 30M39 9c-7 6-7 24 0 30"/></g></svg>
    <div>
      <h1>Donovan Catholic 3v3</h1>
      <div class="sub">Basketball Tournament</div>
    </div>
    <nav class="top-nav" id="nav"></nav>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanName = s => s.trim().replace(/\s+/g," ").split(" ").map(w => w ? w[0].toUpperCase()+w.slice(1) : w).join(" ");
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const uid = () => Math.random().toString(36).slice(2,10);
const defaultState = () => ({ signupsOpen:true, teams:[], bracket:null, published:false, teamNames:{}, conferences:[], games:[], adj:{}, confPublished:false });

/* ---------- backend: Supabase or demo (this browser only) ---------- */
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;
let api;
if (DEMO) {
  const L = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} } };
  const P = () => L.get("dc3_players",[]), S = () => ({...defaultState(), ...L.get("dc3_state",{})});
  const ok = p => { if(p!=="1234") throw new Error("Wrong PIN"); };
  api = {
    async signUp(f,l){ const s=S(); if(!s.signupsOpen) return "closed"; const ps=P();
      if(ps.some(p=>p.first_name.toLowerCase()===f.toLowerCase() && p.last_name.toLowerCase()===l.toLowerCase())) return "dup";
      ps.push({id:uid(),first_name:f,last_name:l,created_at:new Date().toISOString()}); L.set("dc3_players",ps); return "ok"; },
    async getState(){ return S(); },
    async checkPin(p){ return p==="1234"; },
    async listPlayers(p){ ok(p); return P(); },
    async addPlayer(p,f,l){ ok(p); const ps=P(); ps.push({id:uid(),first_name:f,last_name:l,created_at:new Date().toISOString()}); L.set("dc3_players",ps); },
    async updatePlayer(p,id,f,l){ ok(p); L.set("dc3_players",P().map(x=>x.id===id?{...x,first_name:f,last_name:l}:x)); },
    async deletePlayer(p,id){ ok(p); L.set("dc3_players",P().filter(x=>x.id!==id)); },
    async saveState(p,s){ ok(p); L.set("dc3_state",s); }
  };
} else {
  const sb = (typeof supabase !== "undefined" && supabase.createClient) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  const need = () => { if(!sb) throw new Error("Supabase library didn't load"); };
  const rpc = async (fn,args) => { need(); const {data,error} = await sb.rpc(fn,args); if(error) throw error; return data; };
  api = {
    signUp:(f,l)=>rpc("sign_up",{f,l}),
    async getState(){ need(); const {data,error}=await sb.from("tourney").select("state").eq("id",1).single(); if(error) throw error; return {...defaultState(), ...(data?.state||{})}; },
    checkPin:p=>rpc("check_pin",{p}),
    listPlayers:p=>rpc("list_players",{p}),
    addPlayer:(p,f,l)=>rpc("owner_add_player",{p,f,l}),
    updatePlayer:(p,pid,f,l)=>rpc("update_player",{p,pid,f,l}),
    deletePlayer:(p,pid)=>rpc("delete_player",{p,pid}),
    saveState:(p,s)=>rpc("save_state",{p,s})
  };
}

/* ---------- bracket logic ---------- */
/* Fewest byes: the bracket has 2^R slots and E = 2^R - T empty ones. Empty slots are grouped
   into aligned blocks (one per 1-bit of E), so the number of byes = number of 1-bits in E
   (e.g. 25 teams: E=7=4+2+1 -> 3 byes instead of 7). Each block sits next to a full,
   bye-free group, so the team that gets a bye never gets a second one. */
function bracketSlots(T){
  let R = 1; while((1<<R) < T) R++;
  const build = (d, e) => {
    const cap = 1<<d, half = cap>>1;
    if(e === 0) return Array(cap).fill(true);
    if(e === half) return [...Array(half).fill(true), ...Array(half).fill(false)];
    const hi = 1 << (31 - Math.clz32(e));       // biggest empty block on one side, the rest on the other
    return [...build(d-1, hi), ...build(d-1, e-hi)];
  };
  return { R, slots: build(R, (1<<R) - T) };
}
const countByes = T => { let R=1; while((1<<R)<T) R++; let e=(1<<R)-T, c=0; while(e){ c+=e&1; e>>=1; } return c; };
/* Seeded bracket, built backward from a 1-vs-2 final, so if the better seed always wins the
   top seeds meet as late as possible. Same fewest-byes count as the random bracket.
   Byes: with an odd number of teams the #1 seed gets the round-1 bye; any other byes go to the
   next seeds (#2, #3...), and no team ever gets two. Returns slot list (seed numbers / null). */
function seededLeaves(T){
  const counts = [T]; while(counts.at(-1) > 1) counts.push(Math.ceil(counts.at(-1)/2));
  const R = counts.length - 1;
  const oddRounds = counts.slice(0,R).map((c,i)=>c%2 ? i : -1).filter(i=>i>=0);
  const bye = {}; let rest = oddRounds.slice(), b = 1;
  if(T % 2){ bye[rest.shift()] = b++; }
  for(let j=rest.length-1;j>=0;j--) bye[rest[j]] = b++;   // later byes: next-best seeds, latest round first
  const partner = [];
  for(let i=0;i<R;i++){
    const L = []; for(let s=1;s<=counts[i];s++) if(s!==bye[i]) L.push(s);
    const m = {}; for(let j=0;j<L.length/2;j++) m[L[j]] = L[L.length-1-j];   // best vs worst
    partner.push(m);
  }
  const expand = (s, i) => {
    if(i === 0) return [s];
    const r = i - 1;
    if(bye[r] === s) return [...expand(s, r), ...Array(1<<r).fill(null)];
    const o = partner[r][s]; if(o === undefined) throw new Error("seed layout");
    return [...expand(s, r), ...expand(o, r)];
  };
  return expand(1, R);
}
function buildBracket(teamIds, {seeded=false}={}){
  const ids = seeded ? teamIds.slice() : shuffle(teamIds);
  const { R, slots } = bracketSlots(ids.length);
  let k = 0; const leaves = seeded ? seededLeaves(ids.length).map(n => n ? ids[n-1] : null) : slots.map(x => x ? ids[k++] : null);
  const rounds = [];
  const r0 = []; for(let i=0;i<leaves.length;i+=2) r0.push({ a: leaves[i], b: leaves[i+1], winner:null });
  rounds.push(r0);
  for(let n=leaves.length/4; n>=1; n/=2) rounds.push(Array.from({length:n},()=>({a:null,b:null,winner:null})));
  const br = { size: leaves.length, rounds };
  if(seeded){ br.seeded = true; br.seeds = Object.fromEntries(ids.map((id,i)=>[id,i+1])); }
  return resolveBracket(br);
}
function resolveBracket(br){
  br.rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      let deadA, deadB;
      if(r===0){ deadA = !m.a; deadB = !m.b; }
      else{
        const A = br.rounds[r-1][2*i], B = br.rounds[r-1][2*i+1];
        deadA = !!A.dead; deadB = !!B.dead;
        const na = A.winner || null, nb = B.winner || null;
        if(na!==(m.a||null) || nb!==(m.b||null)){ m.sa = null; m.sb = null; m.winner = null; }  // different teams now: old score no longer applies
        m.a = na; m.b = nb;
      }
      m.deadA = deadA; m.deadB = deadB;
      m.dead = deadA && deadB;            // empty slot: nothing here
      m.bye = deadA !== deadB;            // one real side vs nobody: that side moves on
      if(m.dead || m.bye){ m.sa = null; m.sb = null; m.winner = m.dead ? null : ((deadA ? m.b : m.a) || null); }
      else if(!m.a || !m.b){ m.winner = null; m.sa = null; m.sb = null; }
      else if(m.winner && m.winner!==m.a && m.winner!==m.b) m.winner = null;
    });
  });
  return br;
}
/* does a later game (skipping byes) already have a result? */
function laterResult(br, r, mi){
  for(let rr=r+1, i=Math.floor(mi/2); rr<br.rounds.length; rr++, i=Math.floor(i/2)){
    const m = br.rounds[rr][i];
    if(m.bye) continue;
    return !!(m.winner || m.sa != null || m.sb != null);
  }
  return false;
}
function roundName(r,total){
  const left = total - r;
  if(left===1) return "Final";
  if(left===2) return "Semifinal";
  if(left===3) return "Quarterfinal";
  return "Round " + (r+1);
}
function renderBracket(state, {editable=false}={}){
  const br = state.bracket; if(!br) return "";
  const name = id => state.teamNames?.[id] || "Team";
  const R = br.rounds.length;
  const matchHTML = (m, r, mi) => {
    if(m.dead) return `<div class="slot"><div class="match ghost" aria-hidden="true"><div class="team-line"></div><div class="team-line"></div></div></div>`;
    const line = side => {
      const id = m[side], dead = side==="a" ? m.deadA : m.deadB;
      if(dead) return `<div class="team-line bye"><span class="tn">BYE</span></div>`;
      if(!id) return `<div class="team-line tbd"><span class="tn">TBD</span></div>`;
      const st = m.winner ? (m.winner===id ? "win" : "lose") : "";
      const sc = side==="a" ? m.sa : m.sb;
      const score = (editable && m.a && m.b && !m.bye)
        ? `<input class="score-in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" data-r="${r}" data-m="${mi}" data-s="${side}" value="${sc ?? ""}" aria-label="Score for ${esc(name(id))}">`
        : (sc != null ? `<span class="score">${sc}</span>` : "");
      const sd = br.seeded && br.seeds?.[id] ? `<span class="seed">${br.seeds[id]}</span>` : "";
      return `<div class="team-line ${st}">${sd}<span class="tn" title="${esc(name(id))}">${esc(name(id))}</span>${score}</div>`;
    };
    return `<div class="slot"><div class="match">${line("a")}${line("b")}</div></div>`;
  };
  // one column: matches [from, to) of round r, on the left or right side
  const column = (r, from, to, side) => {
    const round = br.rounds[r], cls = ["round", side==="r"?"side-r":"", "has-next", r>0?"has-prev":""].join(" ");
    let h = `<div class="${cls}"><div class="round-title">${roundName(r,R)}</div><div class="round-body">`;
    if(to - from === 1){ h += `<div class="pair ${round[from].dead?"none":"single"}">${matchHTML(round[from], r, from)}</div>`; }
    else for(let i=from;i<to;i+=2){
      const A = round[i], B = round[i+1];
      const pc = A.dead && B.dead ? "none" : A.dead ? "bottom-only" : B.dead ? "top-only" : "";
      h += `<div class="pair ${pc}">${matchHTML(A,r,i)}${matchHTML(B,r,i+1)}</div>`;
    }
    return h + `</div></div>`;
  };
  const fin = br.rounds[R-1][0], champ = fin.winner;
  const finalCol = `<div class="round final ${R>1?"has-prev":""}"><div class="round-title">Final</div><div class="round-body"><div class="pair"><div class="slot"><div class="final-slot" style="width:100%">${matchHTML(fin, R-1, 0).replace(/^<div class="slot">|<\/div>$/g,"")}
      <div class="champ-box"><div class="k">🏆 Champions</div><div class="v">${champ?esc(name(champ)):"TBD"}</div></div></div></div></div></div></div>`;
  let html = `<div class="zoom-bar"><span>Zoom</span><button class="zb" data-zoom="out" aria-label="Zoom out">−</button><button class="zb" data-zoom="fit" title="Fit the whole bracket on screen">Fit</button><button class="zb" data-zoom="in" aria-label="Zoom in">+</button></div><div class="bracket-wrap"><div class="bracket" style="zoom:${ZOOM}">`;
  for(let r=0;r<R-1;r++){ const n = br.rounds[r].length; html += column(r, 0, n/2, "l"); }
  html += finalCol;
  for(let r=R-2;r>=0;r--){ const n = br.rounds[r].length; html += column(r, n/2, n, "r"); }
  return html + `</div></div>`;
}

/* ---------- conferences: groups, games, standings, seeds ---------- */
const CONF_NAMES = ["North","South","East","West"];
function makeConferences(teamIds){
  const ids = shuffle(teamIds);
  const k = Math.min(4, Math.max(1, Math.floor(ids.length/2)));     // 4 conferences (fewer only if there are very few teams)
  const confs = CONF_NAMES.slice(0,k).map(n=>({ id:"c"+uid(), name:n, teamIds:[] }));
  ids.forEach((id,i)=>confs[i%k].teamIds.push(id));
  return confs;
}
/* Games are only against teams from OTHER conferences, never your own, no repeat matchups,
   and every team plays exactly the same number of games. (That needs an even total: with an
   odd number of teams the games-per-team number has to be even.) */
function maxCrossGames(confs){
  const T = confs.reduce((n,c)=>n+c.teamIds.length,0);
  return Math.max(0, T - Math.max(0, ...confs.map(c=>c.teamIds.length)));
}
function makeCrossGames(confs, N){
  const teams = confs.flatMap(c=>c.teamIds), confOf = {}, size = {};
  confs.forEach(c=>c.teamIds.forEach(id=>{ confOf[id]=c.id; size[id]=c.teamIds.length; }));
  const T = teams.length;
  if(T < 2 || N < 1 || (T*N) % 2) return null;
  const key = (a,b) => a<b ? a+"|"+b : b+"|"+a;
  // pair teams up so each team t gets exactly need[t] partners from other conferences, no repeats
  const pairUp = (needOf, ms) => {
    const stopAt = Date.now() + ms;
    for(let attempt=0; Date.now() < stopAt; attempt++){
      const need = Object.fromEntries(teams.map(t=>[t, needOf(t)])), seen = new Set(), out = [];
      let ok = true;
      for(;;){
        const left = shuffle(teams.filter(t=>need[t]>0)).sort((x,y)=>need[y]-need[x]);
        if(!left.length) break;
        const a0 = left[0];
        const cands = left.filter(b0=>b0!==a0 && confOf[b0]!==confOf[a0] && !seen.has(key(a0,b0)));
        if(!cands.length){ ok = false; break; }
        const most = Math.max(...cands.map(b0=>need[b0])), top = cands.filter(b0=>need[b0]===most);
        const b0 = top[Math.floor(Math.random()*top.length)];
        seen.add(key(a0,b0)); out.push([a0,b0]); need[a0]--; need[b0]--;
      }
      if(ok) return out;
      if(attempt > 4000) break;
    }
    return null;
  };
  const outside = t => T - size[t];
  let edges;
  if(N <= maxCrossGames(confs)/2){
    edges = pairUp(()=>N, 2000);
  } else {
    // lots of games: choose the few opponents each team will NOT play, then play everyone else
    const skip = pairUp(t=>outside(t)-N, 2000); if(!skip) return null;
    const skipped = new Set(skip.map(([x,y])=>key(x,y)));
    edges = [];
    for(let i=0;i<T;i++) for(let j=i+1;j<T;j++){ const x=teams[i], y=teams[j]; if(confOf[x]!==confOf[y] && !skipped.has(key(x,y))) edges.push([x,y]); }
  }
  if(!edges) return null;
  edges = edges.map(([x,y])=>Math.random()<.5 ? [x,y] : [y,x]);
  // split into rounds (nobody plays twice in a round), as few rounds as possible
  let best = null;
  for(let t=0;t<200;t++){
    const busy = [], out = [];
    shuffle(edges).forEach(([x,y])=>{
      let r = 0; while(busy[r] && (busy[r].has(x) || busy[r].has(y))) r++;
      (busy[r] ||= new Set()).add(x).add(y); out.push({a:x, b:y, round:r+1});
    });
    if(!best || busy.length < best.rounds) best = { rounds: busy.length, games: out };
    if(busy.length <= N + (teams.length % 2 ? 1 : 0)) break;
  }
  return best.games.map(g=>({ id:"g"+uid(), round:g.round, a:g.a, b:g.b, sa:null, sb:null })).sort((x,y)=>x.round-y.round);
}
function confStandings(state, conf){
  const rows = conf.teamIds.map(id=>({ id, w:0, l:0, pf:0, pa:0 }));
  const by = Object.fromEntries(rows.map(r=>[r.id,r])), h2h = {};
  (state.games||[]).forEach(g=>{
    if(g.sa==null || g.sb==null || g.sa===g.sb) return;
    const A=by[g.a], B=by[g.b]; if(!A && !B) return;            // games vs other conferences count
    if(A){ A.pf+=g.sa; A.pa+=g.sb; } if(B){ B.pf+=g.sb; B.pa+=g.sa; }
    const aw = g.sa>g.sb;
    if(A){ aw ? A.w++ : A.l++; } if(B){ aw ? B.l++ : B.w++; }
    const W = aw ? g.a : g.b, L = aw ? g.b : g.a;
    h2h[W+">"+L] = (h2h[W+">"+L]||0) + 1;
  });
  rows.forEach(r=>{
    r.cw = r.w; r.cl = r.l;                           // from scored games
    const a = state.adj?.[r.id]; if(a){ r.w = Math.max(0, r.w + (a.w||0)); r.l = Math.max(0, r.l + (a.l||0)); }
    r.pd = r.pf - r.pa; r.pct = (r.w + r.l) ? r.w/(r.w + r.l) : 0;
  });
  const nm = id => state.teamNames?.[id] || "";
  rows.sort((x,y)=> (y.pct-x.pct) || (y.w-x.w) || (x.l-y.l)
    || ((h2h[y.id+">"+x.id]||0) - (h2h[x.id+">"+y.id]||0))   // head-to-head
    || (y.pd-x.pd) || nm(x.id).localeCompare(nm(y.id)));
  return rows;
}
/* Seeds: every conference's 1st place first (best record first), then all 2nd places, and so on. */
function overallSeeds(state){
  const live = new Set(state.teams.filter(t=>t.playerIds.length).map(t=>t.id));
  const tables = (state.conferences||[]).map(c=>confStandings(state,c).filter(r=>live.has(r.id)));
  const out = [], nm = id => state.teamNames?.[id] || "";
  const most = Math.max(0, ...tables.map(t=>t.length));
  for(let p=0;p<most;p++){
    const tier = tables.map(t=>t[p]).filter(Boolean);
    tier.sort((x,y)=>(y.pct-x.pct)||(y.w-x.w)||(x.l-y.l)||(y.pd-x.pd)||nm(x.id).localeCompare(nm(y.id)));
    out.push(...tier.map(r=>r.id));
  }
  state.teams.forEach(t=>{ if(live.has(t.id) && !out.includes(t.id)) out.push(t.id); });   // teams not in a conference go last
  return out;
}
function renderConferences(state, {editable=false}={}){
  const confs = state.conferences || []; if(!confs.length) return "";
  const nm = id => state.teamNames?.[id] || "Team";
  const seedOf = Object.fromEntries(overallSeeds(state).map((id,i)=>[id,i+1]));
  return `<div class="conf-grid">${confs.map((c,ci)=>{
    const rows = confStandings(state,c);
    const head = editable && O.editing==="conf:"+c.id
      ? `<div class="conf-h"><input type="text" id="cn-in" maxlength="30" value="${esc(c.name)}" aria-label="Conference name"></div>
         <div class="rename-bar"><button class="btn small" data-csave="${ci}">Save</button><button class="btn small ghost" data-ccancel>Cancel</button></div>`
      : `<div class="conf-h"><span class="nm" title="${esc(c.name)}">${esc(c.name)}</span><span class="cnt">${c.teamIds.length} teams</span>${editable?`<button class="rename" data-crename="${c.id}" aria-label="Rename ${esc(c.name)}" title="Rename conference">✎</button>`:""}</div>`;
    const moveSel = id => confs.length>1 ? `<select class="mv" data-cmove="${id}" data-from="${ci}" aria-label="Move ${esc(nm(id))} to another conference"><option value="">Move…</option>${confs.map((o,oi)=>oi===ci?"":`<option value="${oi}">${esc(o.name)}</option>`).join("")}</select>` : "";
    const table = `<table class="stand"><thead><tr><th>#</th><th style="text-align:left">Team</th><th>W</th><th>L</th><th class="pdc">PD</th><th>Seed</th>${editable&&confs.length>1?"<th></th>":""}</tr></thead><tbody>
      ${rows.map((r,i)=>`<tr class="${i===0&&(r.w+r.l)?"first":""}"><td class="pl">${i+1}</td><td class="tm" title="${esc(nm(r.id))}">${esc(nm(r.id))}</td>
        <td>${editable?`<input class="rec" inputmode="numeric" maxlength="2" data-rt="${r.id}" data-rk="w" value="${r.w}" aria-label="Wins for ${esc(nm(r.id))}">`:r.w}</td>
        <td>${editable?`<input class="rec" inputmode="numeric" maxlength="2" data-rt="${r.id}" data-rk="l" value="${r.l}" aria-label="Losses for ${esc(nm(r.id))}">`:r.l}</td>
        <td class="pdc">${r.pd>0?"+":""}${r.pd}</td><td class="sd">${seedOf[r.id]?`<span class="seedtag">${seedOf[r.id]}</span>`:""}</td>${editable&&confs.length>1?`<td>${moveSel(r.id)}</td>`:""}</tr>`).join("")}
      </tbody></table>`;
    return `<div class="conf">${head}${table}</div>`;
  }).join("")}</div>` + renderGames(state, {editable});
}
function renderGames(state, {editable=false}={}){
  const games = state.games || [], confs = state.conferences || [];
  const nm = id => state.teamNames?.[id] || "Team";
  const confName = {}; confs.forEach(c=>c.teamIds.forEach(id=>confName[id]=c.name));
  if(!games.length) return editable ? `<h2 class="section-title">Games</h2><div class="card empty">No games yet. Use “Randomize games” above.</div>` : "";
  const rounds = [...new Set(games.map(g=>g.round))].sort((a,b)=>a-b);
  const per = {}; games.forEach(g=>{ per[g.a]=(per[g.a]||0)+1; per[g.b]=(per[g.b]||0)+1; });
  const counts = [...new Set(Object.values(per))];
  const teamCell = (id, cls) => `<span class="${cls}" title="${esc(nm(id))}">${esc(nm(id))}<small class="cf">${esc(confName[id]||"")}</small></span>`;
  return `<h2 class="section-title">Games</h2>
    <p class="legend">Every game is against a team from a different conference.${counts.length===1?` Every team plays ${counts[0]} game${counts[0]>1?"s":""}.`:""}</p>
    <div class="rounds-grid">${rounds.map(rn=>`<div class="conf"><div class="conf-h"><span class="nm">Round ${rn}</span></div><div class="games">${games.filter(g=>g.round===rn).map(g=>{
      const done = g.sa!=null && g.sb!=null && g.sa!==g.sb, aw = done && g.sa>g.sb, bw = done && g.sb>g.sa;
      const box = side => `<input class="gscore" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" data-g="${g.id}" data-s="${side}" value="${(side==="a"?g.sa:g.sb) ?? ""}" aria-label="Score for ${esc(nm(side==="a"?g.a:g.b))}">`;
      const sc = v => `<span class="sc">${v ?? ""}</span>`;
      return `<div class="game">${teamCell(g.a, "ta "+(aw?"w":bw?"l":""))}${editable?box("a"):sc(g.sa)}<span class="dash">${editable||g.sa!=null?"–":"vs"}</span>${editable?box("b"):sc(g.sb)}${teamCell(g.b, "tb "+(bw?"w":aw?"l":""))}</div>`;
    }).join("")}</div></div>`).join("")}</div>`;
}
/* remove a team from conferences, games and records (used when a team is deleted) */
function dropTeamFromConfs(state, id){
  (state.conferences||[]).forEach(c=>c.teamIds = c.teamIds.filter(x=>x!==id));
  state.games = (state.games||[]).filter(g=>g.a!==id && g.b!==id);
  if(state.adj) delete state.adj[id];
}
function clearConfs(state){ state.conferences = []; state.games = []; state.adj = {}; state.confPublished = false; }

/* ---------- zoom (per device, remembered) ---------- */
let ZOOM = (()=>{ try{ const z = parseFloat(localStorage.getItem("dc3_zoom")); return z>0 ? z : 1; }catch{ return 1; } })();
function setZoom(z){
  ZOOM = Math.round(Math.min(1.5, Math.max(0.3, z))*100)/100;
  document.querySelectorAll(".bracket").forEach(b=>b.style.zoom = ZOOM);
  try{ localStorage.setItem("dc3_zoom", ZOOM); }catch{}
}
document.addEventListener("click", e=>{
  const btn = e.target.closest?.("[data-zoom]"); if(!btn) return;
  const kind = btn.dataset.zoom;
  if(kind==="in") return setZoom(ZOOM + 0.1);
  if(kind==="out") return setZoom(ZOOM - 0.1);
  const wrap = document.querySelector(".bracket-wrap"), br = wrap?.querySelector(".bracket"); if(!br) return;
  br.style.zoom = 1; const natural = br.scrollWidth; br.style.zoom = ZOOM;
  setZoom(Math.floor(Math.min(1, (wrap.clientWidth - 32) / natural)*100)/100);
  wrap.scrollLeft = 0;
});

const route = () => (location.hash.replace(/^#\/?/,"") || "signup").split("?")[0];
let pollTimer = null;
function setNav(){
  const r = route();
  const links = r==="owner"
    ? `<a href="#signup">Player page</a>`
    : (r==="bracket" ? `<a href="#signup">Sign up</a>` : `<a href="#bracket">Bracket</a>`);
  $("#nav").innerHTML = links;
}

  clearInterval(pollTimer); pollTimer=null;
  setNav();
  const r = route();
  const banner = DEMO ? `<div class="demo-banner"><b>Demo mode:</b> sign-ups are only saved in this browser. Add your Supabase keys at the top of the file to go live. Owner PIN in demo mode is <b>1234</b>.</div>` : "";
  if(r==="done") return renderDone(banner);

/* ---------- player: sign up ---------- */
async function renderSignup(banner){
  $("#app").innerHTML = `${banner}
  <div class="card center-card">
    <h2>Sign Up</h2>
    <p>Please put in your first and last name.</p>
    <form id="sf" autocomplete="off">
      <div class="row">
        <div><label class="lbl" for="fn">First name</label><input id="fn" type="text" maxlength="40" required></div>
        <div><label class="lbl" for="ln">Last name</label><input id="ln" type="text" maxlength="40" required></div>
      </div>
      <button class="btn block" type="submit">Submit</button>
      <div class="msg err" id="sm"></div>

/* redraw without losing the bracket's sideways scroll position (phones) */
function keepScroll(fn){
  const x = document.querySelector(".bracket-wrap")?.scrollLeft || 0;
  fn();
  const w = document.querySelector(".bracket-wrap"); if(w) w.scrollLeft = x;
}

/* ---------- player: bracket ---------- */
async function renderPlayerBracket(banner){

/* ---------- owner ---------- */
let O = { pin:null, players:[], state:defaultState(), tab:"players", editing:null };
async function renderOwner(banner){
  try{ O.pin = O.pin || sessionStorage.getItem("dc3_pin"); }catch{}
  if(O.pin && await api.checkPin(O.pin).catch(()=>false)) return ownerMain(banner);
  logout();
  $("#app").innerHTML = `${banner}
  <div class="card center-card">
    <h2>Organizer</h2>
    <p>Enter the owner PIN to manage players, teams and the bracket.</p>

    <button class="btn block">Enter</button><div class="msg err" id="pm"></div></form>
  </div>`;
  $("#pin").focus();
  $("#pf").onsubmit = async e => {

    const p = $("#pin").value.trim();

async function ownerLoad(waitForSaves=true){
  if(waitForSaves) await saveChain;   // don't read back before our own pending saves land
  const [players, state] = await Promise.all([api.listPlayers(O.pin), api.getState()]);
  O.players = (players||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  O.state = state; O.rev = state.rev || 0;
}
const pById = id => O.players.find(p=>p.id===id);
const autoName = t => t.playerIds.map(id=>pById(id)?.first_name).filter(Boolean).join(" ") || "Empty team";
const teamName = t => (t.customName || "").trim() || autoName(t);
function teamOf(pid){ return O.state.teams.findIndex(t=>t.playerIds.includes(pid)); }
let saveChain = Promise.resolve();
let pendingSaves = 0;
function save(msg){
  // saves run one at a time, in order, so quick taps can't land out of order
  pendingSaves++;
  const run = saveChain.then(async()=>{
    if(!O.pin) return false;
    try{
      // another owner device (phone + laptop) may have saved since we loaded: never overwrite it
      const server = await api.getState();
      if((server.rev || 0) !== (O.rev || 0)){
        O.state = server; O.rev = server.rev || 0;
        if(route()==="owner") keepScroll(drawOwner);
        toast("Another device just made changes, so this page was refreshed. Please redo your last change.");
        return false;
      }
      O.state.teamNames = Object.fromEntries(O.state.teams.map(t=>[t.id, teamName(t)]));
      const snapshot = JSON.parse(JSON.stringify(O.state));
      snapshot.rev = (O.rev || 0) + 1;
      await api.saveState(O.pin, snapshot);
      O.rev = snapshot.rev; O.state.rev = snapshot.rev;
      if(msg) toast(msg);
      return true;
    }
    catch(e){ return fail(e, "Couldn't save. Try again."); }
  });
  saveChain = run.catch(()=>{}).finally(()=>{ pendingSaves--; });
  return run;
}
async function fail(e, msg){
  console.error(e);
  if(badPin(e)){ pinExpired(); return false; }
  toast(msg);
  try{ await ownerLoad(false); if(route()==="owner") keepScroll(drawOwner); }catch{}
  return false;
}
const badPin = e => /bad pin|wrong pin/i.test(e?.message || "");
function logout(){ O.pin = null; clearInterval(pollTimer); pollTimer = null; try{ sessionStorage.removeItem("dc3_pin"); }catch{} }
function pinExpired(){ logout(); toast("The owner PIN changed. Please log in again."); render(); }
async function ownerMain(banner){
  $("#app").innerHTML = `${banner}<div id="ow"><p class="note">Loading…</p></div>`;
  try{ await ownerLoad(); }catch(e){ console.error(e); if(badPin(e)) return pinExpired(); $("#ow").innerHTML = `<p class="msg err">Couldn't load data. Check your connection and Supabase setup, then refresh.</p>`; return; }
  drawOwner();
  pollTimer = setInterval(async()=>{
    if(!O.pin || route()!=="owner") return;
    if(O.editing || pendingSaves || midEdit()) return;
    const before = JSON.stringify(O.players);
    let fresh, server;
    try{ [fresh, server] = await Promise.all([api.listPlayers(O.pin), api.getState()]); }catch(e){ if(badPin(e)) pinExpired(); return; }
    if(!O.pin || O.editing || pendingSaves || midEdit()) return;   // never redraw while you're typing
    O.players = (fresh||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    let changed = JSON.stringify(O.players) !== before;
    if((server.rev || 0) !== (O.rev || 0)){ O.state = server; O.rev = server.rev || 0; changed = true; }   // changes from another owner device
    if(changed){ const f = focusKey(); keepScroll(drawOwner); restoreFocus(f); }
  }, 5000);
}
/* are you in the middle of typing something? (a box whose text you've changed, or an open dropdown) */
function midEdit(){
  const el = document.activeElement; if(!el) return false;
  if(el.tagName==="SELECT") return true;
  if(el.tagName==="INPUT" && el.type!=="checkbox") return el.value !== el.defaultValue;
  return false;
}
function focusKey(){
  const el = document.activeElement; if(!el || el===document.body) return null;
  if(el.id) return "#"+el.id;
  const d = el.dataset, keys = ["g","s","rt","rk","r","m"].filter(k=>d[k]!==undefined);
  return keys.length ? "."+el.className.split(" ")[0]+keys.map(k=>`[data-${k}="${d[k]}"]`).join("") : null;
}
function restoreFocus(sel){ if(!sel) return; try{ const el = document.querySelector(sel); if(el){ el.focus(); el.select?.(); } }catch{} }
function drawOwner(){
  if(!$("#ow") || !O.pin) return;
  const s = O.state, n = O.players.length;
  const assigned = new Set(s.teams.flatMap(t=>t.playerIds));
  const unassigned = O.players.filter(p=>!assigned.has(p.id));
  $("#ow").innerHTML = `
  <div class="owner-head">
    <h2>Organizer</h2>
    <div class="stats">
      <div class="stat"><b>${n}</b>players</div>
      <div class="stat"><b>${s.teams.length}</b>teams</div>
      <div class="stat"><b>${s.published?"Live":"Hidden"}</b>bracket</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab ${O.tab==="players"?"on":""}" data-tab="players">Players (${n})</button>
    <button class="tab ${O.tab==="teams"?"on":""}" data-tab="teams">Teams${unassigned.length&&s.teams.length?` · ${unassigned.length} unassigned`:""}</button>
    <button class="tab ${O.tab==="conf"?"on":""}" data-tab="conf">Conferences</button>
    <button class="tab ${O.tab==="bracket"?"on":""}" data-tab="bracket">Bracket</button>
  </div>
  <div id="pane"></div>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=async()=>{
    O.tab=b.dataset.tab; O.editing=null; drawOwner();
    // pick up anything another owner device changed
    if(!pendingSaves){ try{ const sv = await api.getState(); if(!pendingSaves && (sv.rev||0)!==(O.rev||0)){ O.state = sv; O.rev = sv.rev||0; drawOwner(); } }catch{} }
  });
  if(O.tab==="players") paneplayers();
  else if(O.tab==="teams") paneTeams(unassigned);
  else if(O.tab==="conf") paneConf();
  else paneBracket();
}

  </div>

    }

}

async function deleteAllPlayers(){
  const n = O.players.length; if(!n) return;
  const typed = prompt(`Delete ALL ${n} players?\n\nThis also clears every team and the bracket, and it can't be undone.\n\nType DELETE to confirm.`);
  if(typed === null) return;
  if(typed.trim().toUpperCase() !== "DELETE"){ toast("Nothing deleted. You have to type DELETE."); return; }
  O.editing = "bulk";                               // pause live refresh while this runs
  const btn = $("#delall"); if(btn){ btn.disabled = true; btn.textContent = "Deleting…"; }
  const ids = O.players.map(p=>p.id); let done = 0, failed = 0;
  try{
    for(let i=0;i<ids.length;i+=8){
      await Promise.all(ids.slice(i,i+8).map(id => api.deletePlayer(O.pin,id).then(()=>done++, e=>{ if(badPin(e)) throw e; console.error(e); failed++; })));
      if(btn) btn.textContent = `Deleting… ${done}/${n}`;
    }
  }catch(e){ O.editing = null; return fail(e, "Couldn't delete players"); }
  try{ await ownerLoad(); }catch(e){ O.editing = null; return fail(e, "Couldn't reload players"); }
  O.state.teams = []; O.state.bracket = null; O.state.published = false; clearConfs(O.state);
  O.editing = null;
  await save(failed ? `Deleted ${done} players. ${failed} couldn't be deleted, try again.` : `Deleted all ${done} players`);
  drawOwner();
}

/* teams tab */
function randomizeTeams(){
  const ids = shuffle(O.players.map(p=>p.id));
  const T = Math.max(1, Math.floor(ids.length/3));
  const teams = Array.from({length:T},()=>({id:"t"+uid(), playerIds:[]}));
  ids.forEach((id,i)=> teams[i < T*3 ? Math.floor(i/3) : (i - T*3) % T].playerIds.push(id));
  return teams;
}

    O.state.teams.splice(+i,1);
    if(confGames) setTimeout(()=>toast(`${confGames} team${confGames>1?"s are":" is"} now a game short. Use “Re-randomize games” on the Conferences tab to even it out.`), 1900);
    await save(n ? `Team deleted. ${n} player${n>1?"s":""} moved to Unassigned` : "Team deleted"); keepScroll(drawOwner);
  };
}

/* conferences tab */
function paneConf(){
  const s = O.state, live = s.teams.filter(t=>t.playerIds.length), confs = s.conferences || [];
  const inConf = new Set(confs.flatMap(c=>c.teamIds));
  const loose = live.filter(t=>!inConf.has(t.id));
  const T = confs.reduce((n,c)=>n+c.teamIds.length,0);
  const maxG = maxCrossGames(confs);
  const scored = (s.games||[]).filter(g=>g.sa!=null||g.sb!=null).length;
  if(live.length < 2){ $("#pane").innerHTML = `<div class="card empty">Make teams first (Teams tab), then come back here to split them into conferences.</div>`; return; }
  $("#pane").innerHTML = `
  <div class="toolbar">
    <button class="btn" id="rconf">${confs.length?"Re-randomize conferences":"Randomize conferences"}</button>
    ${confs.length ? `<label class="toggle"><input type="checkbox" id="cpub" ${s.confPublished?"checked":""}> Show conferences &amp; games to players</label>` : ""}
    <span class="spacer"></span>
    <span class="note">${confs.length ? `${live.length} teams in ${confs.length} conferences (${confs.map(c=>c.teamIds.length).join(", ")} teams).` : `${live.length} teams will be split into ${Math.min(4, Math.max(1, Math.floor(live.length/2)))} conferences at random.`}</span>
  </div>
  ${confs.length ? `
  <div class="card" style="margin-bottom:14px;padding:14px 16px">
    <form id="gform" class="toolbar" style="margin:0" autocomplete="off">
      <label class="lbl" for="gpt" style="margin:0">Games per team</label>
      <input id="gpt" class="num-in" type="text" inputmode="numeric" maxlength="2" placeholder="${T%2 ? 2 : 3}" value="${s.gamesPerTeam ?? ""}">
      <button class="btn" id="rgames">${(s.games||[]).length ? "Re-randomize games" : "Randomize games"}</button>
      <span class="note">Every team plays the same number of games, all against teams from other conferences (never their own, never the same team twice). Max ${T%2 && maxG%2 ? maxG-1 : maxG}.${T%2 ? ` With ${T} teams (an odd number) it has to be an even number, otherwise one team would be left a game short.` : ""}</span>
    </form>
  </div>
  <p class="note" style="margin:0 0 12px">Type scores and the records update by themselves, or type over any W or L to change a record. Ties in the standings go to head-to-head, then point difference (PD). Use ✎ to rename a conference.</p>
  ${loose.length ? `<div class="card" style="margin-bottom:14px;padding:12px 16px"><b>Not in a conference:</b> ${loose.map(t=>`<span style="display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0">${esc(teamName(t))} <select class="mv" data-cadd="${t.id}" aria-label="Add ${esc(teamName(t))} to a conference"><option value="">Add to…</option>${confs.map((c,ci)=>`<option value="${ci}">${esc(c.name)}</option>`).join("")}</select></span>`).join("")}</div>` : ""}
  ${renderConferences(s,{editable:true})}` : `<div class="card empty">No conferences yet. Hit <b>Randomize conferences</b> to split the teams into 4 random conferences.</div>`}`;

  const redraw = () => {
    const f = document.activeElement?.dataset; const g = f?.g, side = f?.s, rt = f?.rt, rk = f?.rk;
    drawOwner();
    const el = g ? document.querySelector(`.gscore[data-g="${g}"][data-s="${side}"]`) : rt ? document.querySelector(`.rec[data-rt="${rt}"][data-rk="${rk}"]`) : null;
    if(el){ el.focus(); el.select?.(); }
  };
  $("#rconf").onclick = async () => {
    if(confs.length && !confirm("Re-randomize conferences? This makes new conferences and clears all conference games and records.")) return;
    O.state.conferences = makeConferences(live.map(t=>t.id)); O.state.games = []; O.state.adj = {};
    await save("Conferences randomized"); drawOwner();
  };
  $("#cpub")?.addEventListener("change", async e=>{ O.state.confPublished = e.target.checked; await save(e.target.checked ? "Players can see conferences" : "Conferences hidden from players"); drawOwner(); });
  $("#gform")?.addEventListener("submit", async e=>{
    e.preventDefault();
    const v = $("#gpt").value.trim();
    if(!/^\d{1,2}$/.test(v) || +v < 1){ toast("Type how many games each team plays (a number)"); $("#gpt").focus(); return; }
    const n = +v, top = T%2 && maxG%2 ? maxG-1 : maxG;
    if(T % 2 && n % 2){ toast(`With ${T} teams it has to be an even number (like ${Math.max(2,n-1)} or ${n+1}) so everyone plays the same amount`); $("#gpt").focus(); return; }
    if(n > top){ toast(`${top} is the most: there are only ${maxG} teams outside the biggest conference`); $("#gpt").focus(); return; }
    if(scored && !confirm(`Make new games? This clears all ${scored} score${scored>1?"s":""} and any record changes.`)) return;
    const games = makeCrossGames(O.state.conferences, n);
    if(!games){ toast(`${n} games each can't work out with these conference sizes. Try ${Math.max(1, n-(T%2?2:1))}.`); $("#gpt").focus(); return; }
    O.state.gamesPerTeam = n; O.state.games = games; O.state.adj = {};
    await save(`${games.length} games made, ${n} per team`); drawOwner();
  });
  // scores + records
  $("#pane").onchange = async e => {
    const el = e.target;
    if(el.classList.contains("gscore")){
      const g = O.state.games.find(x=>x.id===el.dataset.g); if(!g) return;
      const key = el.dataset.s==="a" ? "sa" : "sb", v = el.value.trim();
      if(v!=="" && !/^\d{1,3}$/.test(v)){ toast("Scores have to be whole numbers"); el.value = g[key] ?? ""; return; }
      g[key] = v==="" ? null : +v;
      if(g.sa!=null && g.sb!=null && g.sa===g.sb) toast("It's a tie, so it won't count. Enter the final score with a winner.");
      await new Promise(r=>setTimeout(r,0)); redraw();
      const done = g.sa!=null && g.sb!=null && g.sa!==g.sb;
      await save(done ? `${O.state.teamNames[g.sa>g.sb?g.a:g.b] || "Team"} win ${Math.max(g.sa,g.sb)}–${Math.min(g.sa,g.sb)}` : "");
      return;
    }
    if(el.classList.contains("rec")){
      const id = el.dataset.rt, k = el.dataset.rk, v = el.value.trim();
      const conf = confs.find(c=>c.teamIds.includes(id)); if(!conf) return;
      const row = confStandings(O.state, conf).find(r=>r.id===id);
      if(!/^\d{1,2}$/.test(v)){ toast("Records have to be whole numbers"); el.value = row[k]; return; }
      O.state.adj ||= {}; const a = (O.state.adj[id] ||= {w:0,l:0});
      a[k] = +v - (k==="w" ? row.cw : row.cl);          // keep what you typed, even as more games get scored
      if(!a.w && !a.l) delete O.state.adj[id];
      await new Promise(r=>setTimeout(r,0)); redraw();
      await save("Record updated");
      return;
    }
    if(el.dataset.cmove !== undefined && el.value !== ""){
      const id = el.dataset.cmove, from = +el.dataset.from, to = +el.value;
      const newMates = new Set(confs[to].teamIds);
      const clash = O.state.games.filter(g=>(g.a===id && newMates.has(g.b)) || (g.b===id && newMates.has(g.a))).length;
      if(clash && !confirm(`Move ${O.state.teamNames[id] || "this team"} to ${confs[to].name}? It already has ${clash} game${clash>1?"s":""} against ${confs[to].name} teams. Its games stay, but you may want to “Re-randomize games” so nobody plays their own conference.`)){ el.value=""; return; }
      O.state.conferences[from].teamIds = O.state.conferences[from].teamIds.filter(x=>x!==id);
      O.state.conferences[to].teamIds.push(id);
      await save("Team moved"); drawOwner(); return;
    }
    if(el.dataset.cadd !== undefined && el.value !== ""){
      O.state.conferences[+el.value].teamIds.push(el.dataset.cadd);
      await save("Team added to conference"); drawOwner(); return;
    }
  };
  // rename conferences
  const saveConfName = async (ci, name) => {
    name = (name||"").trim().replace(/\s+/g," ").slice(0,30);
    if(!name){ toast("Conference name can't be blank"); return; }
    O.state.conferences[ci].name = name; O.editing = null;
    await save(`Renamed to ${name}`); drawOwner();
  };
  $("#pane").onclick = e => {
    const d = e.target.dataset || {};
    if(d.crename){ O.editing = "conf:"+d.crename; drawOwner(); const i=$("#cn-in"); if(i){ i.focus(); i.select(); } return; }
    if(d.csave !== undefined) return saveConfName(+d.csave, $("#cn-in")?.value);
    if(e.target.hasAttribute("data-ccancel")){ O.editing = null; drawOwner(); }
  };
  $("#pane").onkeydown = e => {
    if(e.target.id==="cn-in"){ if(e.key==="Enter"){ e.preventDefault(); document.querySelector("[data-csave]")?.click(); } if(e.key==="Escape"){ O.editing=null; drawOwner(); } return; }
    if((e.target.classList?.contains("gscore") || e.target.classList?.contains("rec")) && e.key==="Enter"){ e.preventDefault(); e.target.blur(); }
  };
  $("#pane").onfocusin = e => { if(e.target.classList?.contains("gscore") || e.target.classList?.contains("rec")) e.target.select(); };
}

/* bracket tab */
function paneBracket(){
  const s = O.state, T = s.teams.filter(t=>t.playerIds.length).length;
  const byes = T>=2 ? countByes(T) : 0;
  const hasConf = (s.conferences||[]).length > 0;
  $("#pane").innerHTML = `
  <div class="toolbar">
    <button class="btn" id="mk" ${T<2?"disabled":""}>${s.bracket?"Rebuild bracket":"Create bracket"}</button>
    ${s.bracket?`<label class="toggle"><input type="checkbox" id="pub" ${s.published?"checked":""}> Show bracket to players</label>`:""}
    <span class="spacer"></span>
    <span class="note">${T<2?"Make teams first (Teams tab).":`${T} teams → ${byes ? `${byes} bye${byes>1?"s":""} (the fewest possible), never more than one per team` : "no byes needed"}.`}</span>
  </div>
  ${s.bracket ? `<p class="legend">Type both scores for a game. The team with more points moves on automatically. Clear a score to undo.</p>${renderBracket(s,{editable:true})}`
    : `<div class="card empty">${hasConf ? "No bracket yet. It will be built from the conference standings: 1st places get the top seeds, then 2nd places, and so on. The best seeds get the byes." : "No bracket yet. Teams are placed at random, with as few byes as possible. (Set up Conferences first if you want seeding.)"}</div>`}`;
  $("#mk")?.addEventListener("click", async()=>{
    if(s.bracket && !confirm(hasConf ? "Rebuild the bracket? All bracket results will be cleared and seeds redone from the current standings." : "Rebuild the bracket? All results will be cleared and teams re-shuffled.")) return;
    O.state.bracket = hasConf
      ? buildBracket(overallSeeds(O.state), {seeded:true})
      : buildBracket(O.state.teams.filter(t=>t.playerIds.length).map(t=>t.id));
    await save(hasConf ? (s.bracket?"Bracket re-seeded from standings":"Bracket seeded from standings") : (s.bracket?"Bracket rebuilt":"Bracket created")); drawOwner();
  });
  $("#pub")?.addEventListener("change", async e=>{ O.state.published = e.target.checked; await save(e.target.checked?"Bracket is live for players":"Bracket hidden from players"); drawOwner(); });
  const setScore = async inp => {
    const br = O.state.bracket, r = +inp.dataset.r, mi = +inp.dataset.m, side = inp.dataset.s;
    const match = br.rounds[r]?.[mi]; if(!match) return;
    const key = side==="a" ? "sa" : "sb";
    const v = inp.value.trim();
    if(v !== "" && !/^\d{1,3}$/.test(v)){ inp.classList.add("bad"); toast("Scores have to be whole numbers"); inp.value = match[key] ?? ""; setTimeout(()=>inp.classList.remove("bad"),1500); return; }
    const val = v === "" ? null : +v;
    if(val === (match[key] ?? null)) return;
    const next = { sa: match.sa ?? null, sb: match.sb ?? null }; next[key] = val;
    let winner = null;
    if(next.sa != null && next.sb != null){
      if(next.sa === next.sb){ toast("It's a tie. Enter the final score with a winner."); }
      else winner = next.sa > next.sb ? match.a : match.b;
    }
    // changing who won a game wipes the later games they were in: check first
    if(winner !== match.winner && r < br.rounds.length-1){
      if(laterResult(br, r, mi)){
        if(!confirm("This changes who moved on, so the later games this team played will be cleared. Continue?")){ inp.value = match[key] ?? ""; return; }
      }
    }
    match.sa = next.sa; match.sb = next.sb; match.winner = winner;
    resolveBracket(br);
    // redraw but keep the cursor where you were (e.g. after Tab to the next box)
    await new Promise(res=>setTimeout(res,0));
    const f = document.activeElement?.classList?.contains("score-in") ? document.activeElement.dataset : null;
    keepScroll(paneBracket);
    if(f){ const el = document.querySelector(`.score-in[data-r="${f.r}"][data-m="${f.m}"][data-s="${f.s}"]`); if(el){ el.focus(); el.select(); } }
    await save(winner ? `${O.state.teamNames[winner] || "Team"} win ${Math.max(next.sa,next.sb)}–${Math.min(next.sa,next.sb)}` : "");
  };
  $("#pane").onchange = e => { if(e.target.classList.contains("score-in")) setScore(e.target); };
  $("#pane").onkeydown = e => { if(e.target.classList?.contains("score-in") && e.key==="Enter"){ e.preventDefault(); e.target.blur(); } };
  $("#pane").onfocusin = e => { if(e.target.classList?.contains("score-in")) e.target.select(); };
}

render();
</script>
</body>
</html>
