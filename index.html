<style>
:root{
  --navy:#0a2a66; --blue:#1450b8; --blue-2:#2f6fe0; --sky:#e8f0fd; --line:#c9d8f3;
  --ink:#0d1b33; --muted:#5b6b86; --white:#fff; --bg:#f4f7fd; --ok:#127a3e; --warn:#b5590d; --bad:#b3261e;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Oswald,Impact,sans-serif;letter-spacing:.02em;margin:0}
button,input,select{font:inherit}
.hidden{display:none!important}

/* header */
header.top{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -10% -60px -10%;height:120px;background:var(--blue);transform:rotate(-2deg);opacity:.55}
.top-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 16px 26px;display:flex;align-items:center;gap:14px}
.ball{width:44px;height:44px;flex:none}
.top h1{font-size:clamp(22px,4.5vw,32px);line-height:1.05;text-transform:uppercase}
.top .sub{font-size:13px;opacity:.85;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.top-nav{margin-left:auto;display:flex;gap:6px}
.top-nav a{white-space:nowrap;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4)}
.top-nav a:hover{background:rgba(255,255,255,.12)}

main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.demo-banner{background:#fff6e5;color:#7a4300;border:1px solid #f3d29a;padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:18px}

/* cards & forms */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 0 rgba(10,42,102,.04)}
.center-card{max-width:460px;margin:24px auto 0;text-align:center}
.center-card h2{font-size:28px;color:var(--navy);text-transform:uppercase}
.center-card p{color:var(--muted);margin:8px 0 18px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--navy);text-align:left;margin:0 0 6px}
input[type=text],input[type=password],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(47,111,224,.18)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--navy)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;margin-top:14px;font-size:17px;padding:14px}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--sky)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0c9c6}
.btn.danger:hover{background:#fdf0ef}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.err{color:var(--bad)}
.check{width:76px;height:76px;border-radius:50%;background:var(--blue);display:grid;place-items:center;margin:4px auto 14px}
.link{color:var(--blue);font-weight:600}

/* owner */
.owner-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.owner-head h2{font-size:26px;color:var(--navy);text-transform:uppercase}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--navy);font-size:16px;margin-right:4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--navy);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.note{font-size:13px;color:var(--muted)}

table.players{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.players th,table.players td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf2fb;font-size:15px}
table.players th{background:var(--sky);color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
table.players tr:last-child td{border-bottom:0}
table.players td.num{color:var(--muted);width:40px}
table.players td.act{text-align:right;white-space:nowrap}
table.players input{padding:7px 9px;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sky);color:var(--blue)}
.tag.none{background:#f1f1f1;color:#888}
.empty{padding:30px;text-align:center;color:var(--muted)}

.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.team.off{border-color:#f0c48e}
.team-h{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px}
.team.off .team-h{background:var(--warn)}
.team-h .num{font-family:Oswald,Impact,sans-serif;font-size:13px;opacity:.75}
.team-h .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-h .cnt{font-size:12px;opacity:.85}
.team ul{list-style:none;margin:0;padding:6px}
.team li{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:14px}
.team li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li select{width:auto;max-width:120px;padding:4px 6px;font-size:13px;border-radius:7px}
.team .foot{padding:4px 12px 10px;text-align:right}
.team.pool{border-style:dashed}
.team.pool .team-h{background:#6b7a93}

/* bracket */
.bracket-wrap{overflow-x:auto;padding:6px 2px 14px;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:30px;min-width:max-content;align-items:stretch}
.round{display:flex;flex-direction:column;width:210px;flex:none}
.round-title{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;color:var(--navy);font-size:15px;text-align:center;padding:6px 0 10px;border-bottom:2px solid var(--blue);margin-bottom:8px}
.round-body{flex:1;display:flex;flex-direction:column}
.pair{flex:1;display:flex;flex-direction:column;position:relative}
.pair>.slot{flex:1;display:flex;align-items:center;padding:6px 0}
.has-next .pair::after{content:"";position:absolute;right:-16px;top:25%;bottom:25%;width:14px;border:2px solid var(--line);border-left:0;border-radius:0 6px 6px 0}
.has-next .pair.single::after{top:50%;bottom:auto;height:0;border-top:2px solid var(--line);border-right:0;border-bottom:0;border-radius:0}
.has-prev .match::before{content:"";position:absolute;left:-16px;top:50%;width:14px;border-top:2px solid var(--line)}
.match{position:relative;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.team-line{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:14px;font-weight:600;min-height:38px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.team-line+.team-line{border-top:1px solid #edf2fb}
.team-line .seed{font-size:11px;color:var(--muted);width:16px;flex:none;font-weight:700}
.team-line .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-line.bye{color:#a5afc2;font-style:italic;font-weight:500}
.team-line.tbd{color:#a5afc2;font-weight:500}
.team-line.win{background:var(--blue);color:#fff}
.team-line.win .seed{color:rgba(255,255,255,.75)}
.team-line.lose{color:#9aa6bb;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.2)}
.clickable .team-line.can{cursor:pointer}
.clickable .team-line.can:hover{background:var(--sky)}
.clickable .team-line.win:hover{background:var(--navy)}
.champ{display:flex;flex-direction:column;justify-content:center;width:210px;flex:none}
.champ-box{background:var(--navy);color:#fff;border-radius:12px;padding:16px;text-align:center}
.champ-box .k{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:13px;opacity:.8}
.champ-box .v{font-family:Oswald,Impact,sans-serif;font-size:22px;margin-top:6px;line-height:1.15}
.waiting{max-width:520px;margin:30px auto;text-align:center}
.waiting h2{color:var(--navy);text-transform:uppercase;font-size:26px}
.waiting p{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin:-4px 0 12px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .top-nav a{padding:6px 10px;font-size:13px}
  .row{flex-direction:column}
  table.players .hide-sm{display:none}
  .card{padding:18px}
}
</style>

<body>

<header class="top">
  <div class="top-inner">
    <svg class="ball" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fff"/><g fill="none" stroke="#1450b8" stroke-width="2.4"><circle cx="24" cy="24" r="21"/><path d="M3 24h42M24 3v42M9 9c7 6 7 24 0 30M39 9c-7 6-7 24 0 30"/></g></svg>
    <div>
      <h1>Donovan Catholic 3v3</h1>
      <div class="sub">Basketball Tournament</div>
    </div>
    <nav class="top-nav" id="nav"></nav>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cleanName = s => s.trim().replace(/\s+/g," ").split(" ").map(w => w ? w[0].toUpperCase()+w.slice(1) : w).join(" ");
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const uid = () => Math.random().toString(36).slice(2,10);
const defaultState = () => ({ signupsOpen:true, teams:[], bracket:null, published:false, teamNames:{} });

/* ---------- backend: Supabase or demo (this browser only) ---------- */
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;
let api;
if (DEMO) {
  const L = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} } };
  const P = () => L.get("dc3_players",[]), S = () => ({...defaultState(), ...L.get("dc3_state",{})});
  const ok = p => { if(p!=="1234") throw new Error("Wrong PIN"); };
  api = {
    async signUp(f,l){ const s=S(); if(!s.signupsOpen) return "closed"; const ps=P();
      if(ps.some(p=>p.first_name.toLowerCase()===f.toLowerCase() && p.last_name.toLowerCase()===l.toLowerCase())) return "dup";
      ps.push({id:uid(),first_name:f,last_name:l,created_at:new Date().toISOString()}); L.set("dc3_players",ps); return "ok"; },
    async getState(){ return S(); },
    async checkPin(p){ return p==="1234"; },
    async listPlayers(p){ ok(p); return P(); },
    async addPlayer(p,f,l){ ok(p); const ps=P(); ps.push({id:uid(),first_name:f,last_name:l,created_at:new Date().toISOString()}); L.set("dc3_players",ps); },
    async updatePlayer(p,id,f,l){ ok(p); L.set("dc3_players",P().map(x=>x.id===id?{...x,first_name:f,last_name:l}:x)); },
    async deletePlayer(p,id){ ok(p); L.set("dc3_players",P().filter(x=>x.id!==id)); },
    async saveState(p,s){ ok(p); L.set("dc3_state",s); }
  };
} else {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const rpc = async (fn,args) => { const {data,error} = await sb.rpc(fn,args); if(error) throw error; return data; };
  api = {
    signUp:(f,l)=>rpc("sign_up",{f,l}),
    async getState(){ const {data,error}=await sb.from("tourney").select("state").eq("id",1).single(); if(error) throw error; return {...defaultState(), ...(data?.state||{})}; },
    checkPin:p=>rpc("check_pin",{p}),
    listPlayers:p=>rpc("list_players",{p}),
    addPlayer:(p,f,l)=>rpc("owner_add_player",{p,f,l}),
    updatePlayer:(p,pid,f,l)=>rpc("update_player",{p,pid,f,l}),
    deletePlayer:(p,pid)=>rpc("delete_player",{p,pid}),
    saveState:(p,s)=>rpc("save_state",{p,s})
  };
}

/* ---------- bracket logic ---------- */
function seedOrder(n){ let o=[1]; while(o.length<n){ const m=o.length*2+1; o=o.flatMap(s=>[s,m-s]); } return o; }
function buildBracket(teamIds){
  const ids = shuffle(teamIds), T = ids.length;
  let size = 2; while(size < T) size *= 2;
  const order = seedOrder(size), seeds = {};
  ids.forEach((id,i)=>seeds[id]=i+1);
  const rounds = [];
  const r0 = [];
  for(let i=0;i<size;i+=2) r0.push({ a: ids[order[i]-1] ?? null, b: ids[order[i+1]-1] ?? null, winner:null });
  rounds.push(r0);
  for(let n=size/4; n>=1; n/=2) rounds.push(Array.from({length:n},()=>({a:null,b:null,winner:null})));
  const br = { size, seeds, rounds };
  return resolveBracket(br);
}
function resolveBracket(br){
  br.rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      if(r>0){ m.a = br.rounds[r-1][2*i].winner; m.b = br.rounds[r-1][2*i+1].winner; }
      const bye = r===0 && ((m.a && !m.b) || (!m.a && m.b));
      if(bye) m.winner = m.a || m.b;
      else if(m.winner && m.winner!==m.a && m.winner!==m.b) m.winner = null;
      if(!m.a || !m.b){ if(!bye) m.winner = null; }
    });
  });
  return br;
}
function roundName(r,total){
  const left = total - r;
  if(left===1) return "Final";
  if(left===2) return "Semifinals";
  if(left===3) return "Quarterfinals";
  return "Round " + (r+1);
}
function renderBracket(state, {editable=false}={}){
  const br = state.bracket; if(!br) return "";
  const name = id => state.teamNames?.[id] || "Team";
  const R = br.rounds.length;
  let html = `<div class="bracket-wrap"><div class="bracket ${editable?"clickable":""}">`;
  br.rounds.forEach((round,r)=>{
    const cls = [r<R-1?"has-next":"", r>0?"has-prev":""].join(" ");
    html += `<div class="round ${cls}"><div class="round-title">${roundName(r,R)}</div><div class="round-body">`;
    const pairs = round.length===1 ? [[round[0]]] : [];
    if(round.length>1) for(let i=0;i<round.length;i+=2) pairs.push([round[i],round[i+1]]);
    pairs.forEach((pr,pi)=>{
      html += `<div class="pair ${pr.length===1?"single":""}">`;
      pr.forEach((m,k)=>{
        const mi = round.length===1 ? 0 : pi*2+k;
        const line = (side) => {
          const id = m[side], other = m[side==="a"?"b":"a"];
          if(!id){
            const isBye = r===0 && other;
            return `<div class="team-line ${isBye?"bye":"tbd"}"><span class="seed"></span><span class="tn">${isBye?"BYE":"TBD"}</span></div>`;
          }
          const st = m.winner ? (m.winner===id ? "win" : "lose") : "";
          const can = editable && m.a && m.b ? "can" : "";
          const attrs = can ? `role="button" tabindex="0" data-r="${r}" data-m="${mi}" data-t="${esc(id)}"` : "";
          return `<div class="team-line ${st} ${can}" ${attrs}><span class="seed">${r===0?(br.seeds[id]||""):""}</span><span class="tn" title="${esc(name(id))}">${esc(name(id))}</span></div>`;
        };
        html += `<div class="slot"><div class="match">${line("a")}${line("b")}</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  const champ = br.rounds[R-1][0].winner;
  html += `<div class="champ"><div class="champ-box"><div class="k">🏆 Champions</div><div class="v">${champ?esc(name(champ)):"TBD"}</div></div></div>`;
  html += `</div></div>`;
  return html;
}

/* ---------- routing ---------- */
const route = () => (location.hash.replace(/^#\/?/,"") || "signup").split("?")[0];
let pollTimer = null;
function setNav(){
  const r = route();
  const links = r==="owner"
    ? `<a href="#signup">Player page</a>`
    : (r==="bracket" ? `<a href="#signup">Sign up</a>` : `<a href="#bracket">Bracket</a>`);
  $("#nav").innerHTML = links;
}
async function render(){
  clearInterval(pollTimer); pollTimer=null;
  setNav();
  const r = route();
  const banner = DEMO ? `<div class="demo-banner"><b>Demo mode:</b> sign-ups are only saved in this browser. Add your Supabase keys at the top of the file to go live. Owner PIN in demo mode is <b>1234</b>.</div>` : "";
  if(r==="done") return renderDone(banner);
  if(r==="bracket") return renderPlayerBracket(banner);
  if(r==="owner") return renderOwner(banner);
  return renderSignup(banner);
}
window.addEventListener("hashchange", render);

/* ---------- player: sign up ---------- */
async function renderSignup(banner){
  $("#app").innerHTML = `${banner}
  <div class="card center-card">
    <h2>Sign Up</h2>
    <p>Please put in your first and last name.</p>
    <form id="sf" autocomplete="off">
      <div class="row">
        <div><label class="lbl" for="fn">First name</label><input id="fn" type="text" maxlength="40" required></div>
        <div><label class="lbl" for="ln">Last name</label><input id="ln" type="text" maxlength="40" required></div>
      </div>
      <button class="btn block" type="submit">Submit</button>
      <div class="msg err" id="sm"></div>
    </form>
  </div>`;
  $("#fn").focus();
  $("#sf").onsubmit = async e => {
    e.preventDefault();
    const f = cleanName($("#fn").value), l = cleanName($("#ln").value);
    if(!f || !l){ $("#sm").textContent = "Please type both your first and last name."; return; }
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Submitting…";
    try{
      const res = await api.signUp(f,l);
      if(res==="closed"){ $("#sm").textContent = "Sign-ups are closed. Find the tournament organizer."; btn.disabled=false; btn.textContent="Submit"; return; }
      try{ sessionStorage.setItem("dc3_me", f); }catch{}
      location.hash = "done" + (res==="dup" ? "?dup" : "");
    }catch(err){
      console.error(err); $("#sm").textContent = "Couldn't submit. Check your connection and try again.";
      btn.disabled=false; btn.textContent="Submit";
    }
  };
}
function renderDone(banner){
  const dup = location.hash.includes("dup");
  let me = ""; try{ me = sessionStorage.getItem("dc3_me") || ""; }catch{}
  $("#app").innerHTML = `${banner}
  <div class="card center-card">
    <div class="check"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h2>You're good to go${me?", "+esc(me):""}!</h2>
    <p>${dup ? "You were already signed up, so you're all set." : "You're signed up for the 3v3 tournament."} Teams will be picked at random. Check the bracket once the teams are made.</p>
    <a class="btn block" href="#bracket" style="display:block;text-decoration:none">View the bracket</a>
  </div>`;
}

/* ---------- player: bracket ---------- */
async function renderPlayerBracket(banner){
  $("#app").innerHTML = `${banner}<div id="pb"><div class="waiting"><p>Loading…</p></div></div>`;
  const draw = async () => {
    try{
      const s = await api.getState();
      if(!s.published || !s.bracket){
        $("#pb").innerHTML = `<div class="waiting card"><h2>Teams coming soon</h2><p>The teams and bracket haven't been posted yet. This page updates by itself, so keep it open or check back in a bit.</p></div>`;
      } else {
        $("#pb").innerHTML = `<h2 style="color:var(--navy);text-transform:uppercase;font-size:26px;margin-bottom:6px">Tournament Bracket</h2>
          <p class="legend">Find your names below. Winners are shown in blue and the bracket updates live.</p>${renderBracket(s)}`;
      }
    }catch(e){ console.error(e); $("#pb").innerHTML = `<div class="waiting card"><h2>Can't load</h2><p>Check your connection and refresh.</p></div>`; }
  };
  await draw();
  pollTimer = setInterval(draw, 8000);
}

/* ---------- owner ---------- */
let O = { pin:null, players:[], state:defaultState(), tab:"players", editing:null };
async function renderOwner(banner){
  try{ O.pin = O.pin || sessionStorage.getItem("dc3_pin"); }catch{}
  if(O.pin && await api.checkPin(O.pin).catch(()=>false)) return ownerMain(banner);
  O.pin = null;
  $("#app").innerHTML = `${banner}
  <div class="card center-card">
    <h2>Organizer</h2>
    <p>Enter the owner PIN to manage players, teams and the bracket.</p>
    <form id="pf"><label class="lbl" for="pin">Owner PIN</label><input id="pin" type="password" required>
    <button class="btn block">Enter</button><div class="msg err" id="pm"></div></form>
  </div>`;
  $("#pin").focus();
  $("#pf").onsubmit = async e => {
    e.preventDefault();
    const p = $("#pin").value.trim();
    const good = await api.checkPin(p).catch(()=>false);
    if(!good){ $("#pm").textContent = "That PIN isn't right."; return; }
    O.pin = p; try{ sessionStorage.setItem("dc3_pin",p); }catch{}
    ownerMain(banner);
  };
}
async function ownerLoad(){
  const [players, state] = await Promise.all([api.listPlayers(O.pin), api.getState()]);
  O.players = (players||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  O.state = state;
}
const pById = id => O.players.find(p=>p.id===id);
const teamName = t => t.playerIds.map(id=>pById(id)?.first_name).filter(Boolean).join(" ") || "Empty team";
function teamOf(pid){ return O.state.teams.findIndex(t=>t.playerIds.includes(pid)); }
async function save(msg){
  O.state.teamNames = Object.fromEntries(O.state.teams.map(t=>[t.id, teamName(t)]));
  try{ await api.saveState(O.pin, O.state); if(msg) toast(msg); }
  catch(e){ console.error(e); toast("Couldn't save. Try again."); }
}
async function ownerMain(banner){
  $("#app").innerHTML = `${banner}<div id="ow"><p class="note">Loading…</p></div>`;
  try{ await ownerLoad(); }catch(e){ console.error(e); $("#ow").innerHTML = `<p class="msg err">Couldn't load data. Check your Supabase setup.</p>`; return; }
  // drop players who were removed from any team list
  drawOwner();
  pollTimer = setInterval(async()=>{
    if(O.editing || document.activeElement?.tagName==="INPUT" || document.activeElement?.tagName==="SELECT") return;
    const before = O.players.length;
    try{ O.players = (await api.listPlayers(O.pin)).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); }catch{ return; }
    if(O.players.length!==before) drawOwner();
  }, 5000);
}
function drawOwner(){
  const s = O.state, n = O.players.length;
  const assigned = new Set(s.teams.flatMap(t=>t.playerIds));
  const unassigned = O.players.filter(p=>!assigned.has(p.id));
  $("#ow").innerHTML = `
  <div class="owner-head">
    <h2>Organizer</h2>
    <div class="stats">
      <div class="stat"><b>${n}</b>players</div>
      <div class="stat"><b>${s.teams.length}</b>teams</div>
      <div class="stat"><b>${s.published?"Live":"Hidden"}</b>bracket</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab ${O.tab==="players"?"on":""}" data-tab="players">Players (${n})</button>
    <button class="tab ${O.tab==="teams"?"on":""}" data-tab="teams">Teams${unassigned.length&&s.teams.length?` · ${unassigned.length} unassigned`:""}</button>
    <button class="tab ${O.tab==="bracket"?"on":""}" data-tab="bracket">Bracket</button>
  </div>
  <div id="pane"></div>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ O.tab=b.dataset.tab; O.editing=null; drawOwner(); });
  if(O.tab==="players") paneplayers();
  else if(O.tab==="teams") paneTeams(unassigned);
  else paneBracket();
}

/* players tab */
function paneplayers(){
  const s = O.state;
  const rows = O.players.map((p,i)=>{
    const ti = teamOf(p.id);
    const tag = ti>=0 ? `<span class="tag">Team ${ti+1}</span>` : `<span class="tag none">—</span>`;
    if(O.editing===p.id) return `<tr><td class="num">${i+1}</td>
      <td><input type="text" id="ef" value="${esc(p.first_name)}" maxlength="40"></td>
      <td><input type="text" id="el" value="${esc(p.last_name)}" maxlength="40"></td>
      <td class="hide-sm">${tag}</td>
      <td class="act"><button class="btn small" data-save="${p.id}">Save</button> <button class="btn small ghost" data-cancel>Cancel</button></td></tr>`;
    return `<tr><td class="num">${i+1}</td><td>${esc(p.first_name)}</td><td>${esc(p.last_name)}</td><td class="hide-sm">${tag}</td>
      <td class="act"><button class="btn small ghost" data-edit="${p.id}">Edit</button> <button class="btn small danger" data-del="${p.id}">Remove</button></td></tr>`;
  }).join("");
  $("#pane").innerHTML = `
  <div class="card" style="margin-bottom:14px">
    <form id="af" class="row" style="align-items:end" autocomplete="off">
      <div><label class="lbl" for="af1">First name</label><input id="af1" type="text" maxlength="40" required></div>
      <div><label class="lbl" for="af2">Last name</label><input id="af2" type="text" maxlength="40" required></div>
      <div style="flex:0 0 auto"><button class="btn">Add player</button></div>
    </form>
  </div>
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="open" ${s.signupsOpen?"checked":""}> Sign-ups open</label>
    <span class="spacer"></span>
    <span class="note">New sign-ups show up here automatically.</span>
  </div>
  ${O.players.length ? `<table class="players"><thead><tr><th>#</th><th>First</th><th>Last</th><th class="hide-sm">Team</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="card empty">No one has signed up yet. Share the player page link, or add players above.</div>`}`;
  $("#open").onchange = async e => { O.state.signupsOpen = e.target.checked; await save(e.target.checked?"Sign-ups opened":"Sign-ups closed"); drawOwner(); };
  $("#af").onsubmit = async e => {
    e.preventDefault();
    const f = cleanName($("#af1").value), l = cleanName($("#af2").value); if(!f||!l) return;
    try{ await api.addPlayer(O.pin,f,l); await ownerLoad(); toast(`Added ${f} ${l}`); drawOwner(); $("#af1").focus(); }
    catch(err){ console.error(err); toast("Couldn't add player"); }
  };
  $("#pane").onclick = async e => {
    const t = e.target;
    if(t.dataset.edit){ O.editing = t.dataset.edit; paneplayers(); $("#ef")?.focus(); }
    else if(t.hasAttribute("data-cancel")){ O.editing=null; paneplayers(); }
    else if(t.dataset.save){
      const f = cleanName($("#ef").value), l = cleanName($("#el").value); if(!f||!l) return;
      try{ await api.updatePlayer(O.pin,t.dataset.save,f,l); O.editing=null; await ownerLoad(); await save("Name updated"); drawOwner(); }
      catch(err){ console.error(err); toast("Couldn't update"); }
    }
    else if(t.dataset.del){
      const p = pById(t.dataset.del); if(!confirm(`Remove ${p.first_name} ${p.last_name}?`)) return;
      try{
        await api.deletePlayer(O.pin,p.id);
        O.state.teams.forEach(tm=>tm.playerIds = tm.playerIds.filter(id=>id!==p.id));
        await ownerLoad(); O.state.teams.forEach(tm=>tm.playerIds = tm.playerIds.filter(id=>id!==p.id));
        await save("Player removed"); drawOwner();
      }catch(err){ console.error(err); toast("Couldn't remove"); }
    }
  };
}

/* teams tab */
function randomizeTeams(){
  const ids = shuffle(O.players.map(p=>p.id));
  const T = Math.max(1, Math.floor(ids.length/3));
  const teams = Array.from({length:T},()=>({id:"t"+uid(), playerIds:[]}));
  ids.forEach((id,i)=> teams[i < T*3 ? Math.floor(i/3) : (i - T*3)].playerIds.push(id));
  return teams;
}
function paneTeams(unassigned){
  const s = O.state, n = O.players.length;
  const extra = n % 3;
  const opts = (cur) => `<option value="">Move to…</option>` + s.teams.map((t,i)=>i===cur?"":`<option value="${i}">Team ${i+1}</option>`).join("") + (cur>=0?`<option value="-1">Unassigned</option>`:"");
  const member = (pid,ti) => { const p=pById(pid); if(!p) return ""; return `<li><span>${esc(p.first_name)} ${esc(p.last_name)}</span><select data-move="${pid}" data-from="${ti}">${opts(ti)}</select></li>`; };
  const cards = s.teams.map((t,i)=>`
    <div class="team ${t.playerIds.length!==3?"off":""}">
      <div class="team-h"><span class="num">#${i+1}</span><span class="nm">${esc(teamName(t))}</span><span class="cnt">${t.playerIds.length}</span></div>
      <ul>${t.playerIds.map(pid=>member(pid,i)).join("") || `<li class="note">No players</li>`}</ul>
      ${t.playerIds.length===0?`<div class="foot"><button class="btn small danger" data-delteam="${i}">Delete team</button></div>`:""}
    </div>`).join("");
  const pool = unassigned.length && s.teams.length ? `
    <div class="team pool"><div class="team-h"><span class="nm">Unassigned (${unassigned.length})</span></div>
    <ul>${unassigned.map(p=>member(p.id,-1)).join("")}</ul></div>` : "";
  $("#pane").innerHTML = `
  <div class="toolbar">
    <button class="btn" id="rand" ${n<3?"disabled":""}>${s.teams.length?"Re-randomize teams":"Randomize teams"}</button>
    ${s.teams.length?`<button class="btn ghost" id="addteam">Add empty team</button>`:""}
    <span class="spacer"></span>
    <span class="note">${n<3?"Need at least 3 players.":extra?`${n} players doesn't split evenly into 3s, so ${extra} team${extra>1?"s get":" gets"} a 4th player.`:`${n} players → ${n/3} teams of 3.`}</span>
  </div>
  ${s.teams.length ? `<p class="note" style="margin:0 0 12px">Teams with an orange header don't have exactly 3 players. Use “Move to…” to fix mistakes. ${s.bracket?"Name changes show up in the bracket right away.":""}</p>
     <div class="teams-grid">${cards}${pool}</div>`
   : `<div class="card empty">No teams yet. When sign-ups are done, hit <b>Randomize teams</b>.</div>`}`;
  $("#rand")?.addEventListener("click", async()=>{
    if(s.teams.length && !confirm("Re-randomize? This replaces all current teams" + (s.bracket?" and clears the bracket.":"."))) return;
    O.state.teams = randomizeTeams(); O.state.bracket = null; O.state.published = false;
    await save("Teams randomized"); drawOwner();
  });
  $("#addteam")?.addEventListener("click", async()=>{ O.state.teams.push({id:"t"+uid(),playerIds:[]}); await save("Team added"); drawOwner(); });
  $("#pane").onchange = async e => {
    const sel = e.target; if(!sel.dataset.move || sel.value==="") return;
    const pid = sel.dataset.move, from = +sel.dataset.from, to = +sel.value;
    if(from>=0) O.state.teams[from].playerIds = O.state.teams[from].playerIds.filter(x=>x!==pid);
    if(to>=0) O.state.teams[to].playerIds.push(pid);
    await save("Player moved"); drawOwner();
  };
  $("#pane").onclick = async e => {
    const i = e.target.dataset.delteam; if(i===undefined) return;
    const t = O.state.teams[+i];
    if(O.state.bracket && JSON.stringify(O.state.bracket).includes(t.id) && !confirm("This team is in the bracket. Delete it and clear the bracket?")) return;
    if(O.state.bracket && JSON.stringify(O.state.bracket).includes(t.id)){ O.state.bracket=null; O.state.published=false; }
    O.state.teams.splice(+i,1); await save("Team deleted"); drawOwner();
  };
}

/* bracket tab */
function paneBracket(){
  const s = O.state, T = s.teams.filter(t=>t.playerIds.length).length;
  let size=2; while(size<T) size*=2;
  const byes = T>=2 ? size-T : 0;
  $("#pane").innerHTML = `
  <div class="toolbar">
    <button class="btn" id="mk" ${T<2?"disabled":""}>${s.bracket?"Rebuild bracket":"Create bracket"}</button>
    ${s.bracket?`<label class="toggle"><input type="checkbox" id="pub" ${s.published?"checked":""}> Show bracket to players</label>`:""}
    <span class="spacer"></span>
    <span class="note">${T<2?"Make teams first (Teams tab).":`${T} teams → ${size}-team bracket${byes?`, ${byes} bye${byes>1?"s":""}`:""}.`}</span>
  </div>
  ${s.bracket ? `<p class="legend">Tap a team to mark them as the winner of that game. Tap again to undo.</p>${renderBracket(s,{editable:true})}`
    : `<div class="card empty">No bracket yet. Seeding is random; byes go to the top seeds.</div>`}`;
  $("#mk")?.addEventListener("click", async()=>{
    if(s.bracket && !confirm("Rebuild the bracket? All results will be cleared and seeds re-shuffled.")) return;
    O.state.bracket = buildBracket(O.state.teams.filter(t=>t.playerIds.length).map(t=>t.id));
    await save(s.bracket?"Bracket rebuilt":"Bracket created"); drawOwner();
  });
  $("#pub")?.addEventListener("change", async e=>{ O.state.published = e.target.checked; await save(e.target.checked?"Bracket is live for players":"Bracket hidden from players"); drawOwner(); });
  const pick = async el => {
    const r=+el.dataset.r, m=+el.dataset.m, t=el.dataset.t;
    const match = O.state.bracket.rounds[r][m];
    match.winner = match.winner===t ? null : t;
    resolveBracket(O.state.bracket); await save(); paneBracket();
  };
  $("#pane").onclick = e => { const el = e.target.closest(".team-line.can"); if(el) pick(el); };
  $("#pane").onkeydown = e => { const el = e.target.closest?.(".team-line.can"); if(el && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); pick(el); } };
}

render();
</script>
</body>
</html>
